<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同城跑腿平台（精简开源版）</title>
<meta name="description" content="免费开源的同城跑腿系统精简版：发布跑腿订单（取快递/代买/送文件/排队代办）、按手机号查询订单状态，后台跑腿员接单派送与结算看板，真实增删改查功能，纯前端+localStorage实现，可作为学习或二次开发起点。">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">跑腿<span class="accent">帮</span></div>
    <a href="admin.html" class="nav-link">进入跑腿员/运营后台 →</a>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>发布一个跑腿需求</h1>
      <p>取快递、代买、送文件、排队代办……填好取件/送达地址和悬赏金额，跑腿员接单后帮你办好。这是一个真实可用的精简开源系统，数据保存在你浏览器本地。</p>
    </div>

    <div class="grid-2">
      <section class="panel">
        <h2>发布跑腿</h2>
        <div id="postMsg"></div>
        <form id="postForm" novalidate>
          <div class="field">
            <label>跑腿类型</label>
            <select id="typeInput" required>
              <option value="取快递">取快递</option>
              <option value="代买">代买</option>
              <option value="送文件">送文件</option>
              <option value="排队代办">排队代办</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div class="field">
            <label>取件地址</label>
            <input id="pickupInput" type="text" required placeholder="例如：万达广场星巴克">
          </div>
          <div class="field">
            <label>送达地址</label>
            <input id="dropoffInput" type="text" required placeholder="例如：汇景大厦18楼1802">
          </div>
          <div class="field-row">
            <div class="field">
              <label>悬赏金额（元）</label>
              <input id="rewardInput" type="number" min="1" step="1" required placeholder="例如：20">
            </div>
            <div class="field">
              <label>期望完成时间</label>
              <input id="deadlineInput" type="datetime-local" required>
            </div>
          </div>
          <div class="field">
            <label>备注（选填）</label>
            <textarea id="notesInput" rows="2" placeholder="有什么特别要求可以写在这里"></textarea>
          </div>
          <div class="field-row">
            <div class="field">
              <label>你的姓名</label>
              <input id="customerNameInput" type="text" required placeholder="用于联系你">
            </div>
            <div class="field">
              <label>你的手机号</label>
              <input id="customerPhoneInput" type="tel" required placeholder="用于查询订单状态">
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">发布跑腿</button>
        </form>
      </section>

      <section class="panel">
        <h2>查询我的跑腿</h2>
        <p class="sub">输入发布时填写的手机号，查看你名下所有跑腿订单的实时状态。</p>
        <div class="field-row" style="align-items:flex-end">
          <div class="field" style="margin-bottom:0">
            <label>手机号</label>
            <input id="lookupPhoneInput" type="tel" placeholder="输入你的手机号">
          </div>
          <button id="btnLookup" class="btn btn-primary" style="height:39px">查询</button>
        </div>
        <div id="lookupMsg"></div>
        <div id="myErrands" class="errand-list"></div>
      </section>
    </div>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>

<footer style="margin:40px auto 16px;max-width:1100px;padding:16px 20px 0;border-top:1px solid var(--line,rgba(147,160,184,.18));text-align:center;color:var(--muted,#93A0B8);font-size:13px">精简开源演示 &middot; 完整版：<a href="https://inzyxuashop.com/paotui-yuanma.html" target="_blank" rel="noopener" style="color:var(--cyan,#19B8D4);text-decoration:none">同城跑腿系统源码</a></footer>
</body>
</html>
