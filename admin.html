<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运营后台 · 同城跑腿平台（精简开源版）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="brand">跑腿<span class="accent">帮</span> 后台</div>
      <div class="side-link active" data-view="dashboard">仪表盘</div>
      <div class="side-link" data-view="hall">接单大厅</div>
      <div class="side-link" data-view="runners">我的跑腿员</div>
      <div class="side-link" data-view="orders">订单管理</div>
      <div class="side-link" id="btnResetData" style="margin-top:20px;color:var(--red)">重置示例数据</div>
      <a href="index.html" class="side-link">← 返回前台</a>
    </aside>

    <main class="admin-main">
      <section id="view-dashboard" class="admin-view active">
        <div class="page-head"><h1>仪表盘</h1><p>跑腿订单与跑腿员概览。</p></div>
        <div class="stat-grid" id="statGrid"></div>
        <h2 class="section-title">跑腿员排行榜</h2>
        <table>
          <thead><tr><th>跑腿员</th><th>已完成单数</th><th>累计收入</th></tr></thead>
          <tbody id="leaderboardBody"></tbody>
        </table>
      </section>

      <section id="view-hall" class="admin-view">
        <div class="page-head"><h1>接单大厅</h1><p>为待接单的跑腿需求指派跑腿员，或将进行中的订单标记为已送达。</p></div>
        <div id="hallMsg"></div>

        <h2 class="section-title">待接单</h2>
        <div id="openList" class="errand-list"></div>

        <h2 class="section-title" style="margin-top:30px">进行中</h2>
        <div id="acceptedList" class="errand-list"></div>
      </section>

      <section id="view-runners" class="admin-view">
        <div class="page-head"><h1>我的跑腿员</h1><p>管理跑腿员名单。</p></div>
        <div class="table-toolbar">
          <span></span>
          <button class="btn btn-primary btn-sm" id="btnAddRunner">+ 新增跑腿员</button>
        </div>
        <table>
          <thead><tr><th>姓名</th><th>手机号</th><th>已完成单数</th><th>累计收入</th><th>操作</th></tr></thead>
          <tbody id="runnersBody"></tbody>
        </table>
      </section>

      <section id="view-orders" class="admin-view">
        <div class="page-head"><h1>订单管理</h1><p>查看全部跑腿订单，按状态筛选。</p></div>
        <div class="table-toolbar">
          <div class="filter-row" id="orderFilters">
            <button class="filter-btn active" data-status="all">全部</button>
            <button class="filter-btn" data-status="open">待接单</button>
            <button class="filter-btn" data-status="accepted">进行中</button>
            <button class="filter-btn" data-status="delivered">已送达</button>
            <button class="filter-btn" data-status="cancelled">已取消</button>
          </div>
        </div>
        <table>
          <thead><tr><th>类型</th><th>取件地址</th><th>送达地址</th><th>悬赏</th><th>客户</th><th>跑腿员</th><th>状态</th></tr></thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="runnerModalBackdrop">
    <div class="modal">
      <button class="modal-close" id="btnCloseRunnerModal">&times;</button>
      <h2 id="runnerModalTitle">新增跑腿员</h2>
      <div id="runnerModalMsg"></div>
      <form id="runnerForm" novalidate>
        <input type="hidden" id="runnerIdInput">
        <div class="field"><label>姓名</label><input id="runnerNameInput" type="text" required></div>
        <div class="field"><label>手机号</label><input id="runnerPhoneInput" type="tel" required></div>
        <button type="submit" class="btn btn-primary btn-block">保存</button>
      </form>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="admin.js"></script>

<footer style="margin:40px auto 16px;max-width:1100px;padding:16px 20px 0;border-top:1px solid var(--line,rgba(147,160,184,.18));text-align:center;color:var(--muted,#93A0B8);font-size:13px">精简开源演示 &middot; 完整版：<a href="https://inzyxuashop.com/paotui-yuanma.html" target="_blank" rel="noopener" style="color:var(--cyan,#19B8D4);text-decoration:none">同城跑腿系统源码</a></footer>
</body>
</html>
